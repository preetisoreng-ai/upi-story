  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const fmt = (v, d) =>
        v.toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
      const countUp = (sel, from, to, d, at, dur, pre, post) => {
        const node = document.querySelector(sel),
          o = { v: from };
        const paint = () => {
          const v = o.v;
          node.textContent = (pre || "") + (v < 0 ? "−" : "") + fmt(Math.abs(v), d) + (post || "");
        };
        paint();
        tl.to(o, { v: to, duration: dur, ease: "power2.out", onUpdate: paint }, at);
      };
      tl.fromTo(
        "#growth-label",
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power3.out" },
        0.2
      );
      tl.fromTo("#growth-num", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 1.3);
      countUp("#growth-num", 1, 25.5, 1, 1.3, 1.6, "", "×");
      tl.fromTo(
        "#growth-note",
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power3.out" },
        2.6
      );
      tl.to("#growth-copy", { opacity: 0, duration: 0.25, ease: "power2.in" }, 5.6);
      tl.set({}, {}, 5.9);
      window.__timelines["growth"] = tl;
    })();
